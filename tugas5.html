<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tugas 5 JS - Toko Online</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="mb-4 text-center">Manajemen Produk</h2>

    <div class="d-flex gap-2 justify-content-center mb-4">
      <button id="tampil" class="btn btn-primary">Tampilkan Produk</button>
      <button id="tambah" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalTambah">Tambah Produk</button>
      <button id="hapus" class="btn btn-danger">Hapus Produk</button>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title">Daftar Produk</h5>
        <ul id="output" class="list-group"></ul>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalTambah" tabindex="-1" aria-labelledby="modalTambahLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="formTambah">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTambahLabel">Tambah Produk</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="namaProduk" class="form-label">Nama Produk</label>
              <input type="text" class="form-control" id="namaProduk" required>
            </div>
            <div class="mb-3">
              <label for="hargaProduk" class="form-label">Harga Produk</label>
              <input type="number" class="form-control" id="hargaProduk" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
            <button type="submit" class="btn btn-success">Tambah</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const produkDefault = [
      { id: 1, nama: "Laptop", harga: 12000000 },
      { id: 2, nama: "Smartphone", harga: 5000000 },
      { id: 3, nama: "Headset", harga: 700000 },
      { id: 4, nama: "Keyboard", harga: 350000 },
      { id: 5, nama: "Mouse", harga: 250000 }
    ];

    let produkList = []; 
    function tambahProduk(id, nama, harga) {
      const produkBaru = { id, nama, harga: parseInt(harga) };
      produkList = [...produkList, produkBaru];
      tampilkanProduk();
    }

    function hapusProduk(...id) {
      produkList = produkList.filter(p => !id.includes(p.id));
      tampilkanProduk();
    }

    function tampilkanProduk() {
      const output = document.getElementById("output");
      output.innerHTML = "";

      if (produkList.length === 0) {
        const li = document.createElement("li");
        li.className = "list-group-item text-muted text-center";
        li.textContent = "Belum ada produk.";
        output.appendChild(li);
        return;
      }

      produkList.forEach(({ id, nama, harga }) => {
        const li = document.createElement("li");
        li.className = "list-group-item d-flex justify-content-between align-items-center";
        li.innerHTML = `
          <div>
            <input type="checkbox" class="form-check-input me-2" value="${id}">
            <strong>${nama}</strong> (ID: ${id})
          </div>
          <span class="badge bg-info text-dark">Rp ${harga.toLocaleString()}</span>
        `;
        output.appendChild(li);
      });
    }

    const eventHandler = {
      tampil: () => {
        if (produkList.length === 0) produkList = [...produkDefault];
        tampilkanProduk();
      },
      tambah: (nama, harga) => {
        const idBaru = produkList.length ? produkList[produkList.length - 1].id + 1 : 1;
        tambahProduk(idBaru, nama, harga);
      },
      hapus: () => {
        const ceklis = document.querySelectorAll("#output input[type='checkbox']:checked");
        const ids = Array.from(ceklis).map(c => parseInt(c.value));
        if (ids.length === 0) {
          alert("Pilih produk yang mau dihapus!");
          return;
        }
        hapusProduk(...ids);
      }
    };

    document.getElementById("tampil").addEventListener("click", eventHandler.tampil);
    document.getElementById("formTambah").addEventListener("submit", (e) => {
      e.preventDefault();
      const nama = document.getElementById("namaProduk").value;
      const harga = document.getElementById("hargaProduk").value;
      eventHandler.tambah(nama, harga);
      e.target.reset();
      bootstrap.Modal.getInstance(document.getElementById("modalTambah")).hide();
    });
    document.getElementById("hapus").addEventListener("click", eventHandler.hapus);

    document.addEventListener("DOMContentLoaded", tampilkanProduk);
  </script>
</body>
</html>
